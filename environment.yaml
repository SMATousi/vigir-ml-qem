name: blackwater
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.7,<3.11
  - pip
  - pip:
      # pkg_resources was removed from setuptools>=81; qiskit-experiments still imports it
      - setuptools<81

      # requirements.txt
      - torch_geometric>=2.0.0
      - torch
      - numpy
      - scipy
      - scikit-learn
      - matplotlib
      - tqdm
      - qiskit-aer>=0.11.0,<=0.13.3
      - qiskit==0.43.2
      - qiskit-terra>=0.24.1
      - qiskit-experiments>=0.4.0
      - seaborn>=0.13.2
      - pylatexenc>=2.10
      - pandas==1.5.3

      # requirements-dev.txt
      - coverage>=5.5
      - pylint>=2.9.5
      - nbqa>=1.1.1
      - treon>=0.1.3
      - pytest>=6.2.5
      - mypy>=0.780
      - mypy-extensions>=0.4.3
      - tox==3.24.5
      - jupyter-sphinx>=0.3.2
      - nbsphinx>=0.8.8
      - sphinx-autodoc-typehints>=1.17.0
      - reno>=3.5.0
      - black[jupyter]~=22.1
